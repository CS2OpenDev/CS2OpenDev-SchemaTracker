# Scheduled CS2 forward-capture extract
#
# WHAT THIS IS: the forward-capture pipeline: one EXTRACTION LEG per platform
# (windows-x86_64 on windows-latest, linux-x86_64 on ubuntu-latest) plus ONE commit job.
# On a cron (and on demand) each leg resolves the CURRENT public-branch CS2 build, and,
# if that build's set for ITS platform is not already committed, acquires it, walks it,
# emits the complete artifact set + inline changelog, and uploads the result as a
# workflow artifact. The commit job then collects every leg's upload and lands the run's
# output as ONE commit per new build (see SINGLE-COMMIT AGGREGATION below).
#
# NO BUILD HERE (v1.0.1+): this job no longer compiles the walker or the host. It
# DOWNLOADS the latest GitHub Release bundle published by release.yml (the portable
# host `dotnet cs2-schema-tracker.dll` + all 11 prebuilt era walkers per platform +
# the inventory) and RUNS it. So a scheduled "is there a new build?" check now costs
# ONE anonymous PICS probe + ZERO compilation — the heavy ~11-walker x 2-platform
# build cost lives in release.yml, amortized across every 6h probe that finds nothing
# new. This is the efficiency win: the common case (no new build) is a probe, not a build.
#
# CHICKEN-AND-EGG: the FIRST scheduled run needs a Release to already exist. release.yml
# publishes the bundle on the first push to main (and republishes on any bundle-input
# change), so by the time the cron first fires a bundle is present. If none exists yet,
# the download step fails loud ("release.yml must publish a bundle first").
#
# PLATFORM MATRIX: extraction loads that platform's CS2 binaries into the host
# process, so the runner OS MUST match the platform (a linux runner cannot walk
# Windows DLLs and vice versa), hence one leg per (runner OS, platform) pair. The legs
# run in PARALLEL: neither one commits or pushes, so there is nothing to serialize.
# fail-fast: false so one platform's gate failure (e.g. a class-band trip) never
# cancels the other platform's capture — the sets are independent per (build, platform),
# exactly like the operator-run local dumps.
#
# SINGLE-COMMIT AGGREGATION: the legs only extract and upload. actions/checkout pins
# EVERY job of a run to the SHA the run was TRIGGERED at (github.sha), so a leg can
# never safely write against main's moving tip; all git happens in the single `commit`
# job (scripts/commit-forward-capture.ps1 against a checkout of main's true tip), which:
#   - lands every platform set the run produced for a build as ONE commit (both sets
#     when both legs succeed), tagged build/<id> when the tag is new;
#   - still lands a PARTIAL commit when one leg fails (the failed leg keeps the run
#     red; the missing platform is picked up by a later run while the build is still
#     current);
#   - when BOTH legs fail to extract but a PICS appinfo capture arrived, preserves the
#     capture as data/pics-captures/<build>.json. PICS is current-only: if the public
#     branch advances before an extract ever succeeds, an uncommitted capture is lost
#     forever. capture-pics seeds later runs' sidecars from this file (earliest capture
#     wins), so a later successful extract promotes the ORIGINAL capture into
#     artifacts/<build>/pics-appinfo.json, and the landing commit drops the preserved
#     copy (commit-plan names it in removePaths).
#
# RENDER DEVICE (r_*/render convars) — NO GPU OR SOFTWARE RASTERIZER NEEDED. The walk Init's
# the render backend to flush the r_texture_*/r_dx11_*/r_vulkan_*/multigpu_* convars (see
# walker/src/engine_boot.cpp, deferred render-init). It was first assumed this needed a live
# device (WARP on windows / lavapipe on linux), but MEASUREMENT proved otherwise: the render
# convars register in the render module's Init->ConVar_Register, INDEPENDENT of whether a
# device is created. On linux, librendersystemvulkan.so has no hard Vulkan dependency and a
# run with NO Vulkan driver present is byte-identical to one with lavapipe. So both runners
# work with no GRAPHICS setup — windows-latest needs nothing at all; ubuntu-latest needs only
# the small walker system-lib apt install below (WALKER.md's Linux prerequisite — the image
# stopped preinstalling the libva chain, and the current build's panoramauiclient pulls it).
# (A D3D11/Vulkan device may still be created as a side effect — WARP is always present on
# windows; a Vulkan driver, if present, is used on linux — which puts the engine in a
# frame-update state; the render Init is DEFERRED past the data-subsystem phase precisely so
# that side effect cannot make a resource load reentrant. Device creation failing is benign.)
#
# STEAM AUTH (supersedes the former "no secrets in workflows" rule; owner-approved
# 2026-07-18): the DLC-gated tools depot 2347779 (Workshop Tools binaries, now part of
# the walked module set) is NOT visible to anonymous Steam logons, so acquisition needs
# an AUTHENTICATED account. The account is a DEDICATED low-privilege tooling account
# (owns nothing beyond CS2; no payment methods; exists only for depot access), and its
# credentials live in GitHub Actions encrypted secrets — configure STEAM_USERNAME and
# STEAM_PASSWORD in this repo's Settings -> Secrets and variables -> Actions before the
# first authenticated run. LEAST EXPOSURE: the secrets are injected as env vars on the
# resolve + extract steps ONLY (never job-wide, never echoed); the host's DotEnv/auth
# path reads them from the env and never logs their values. Anonymous PICS remains the
# probe path's default; logon throttling (~100 rapid logons) is irrelevant at a 6h
# cadence (a handful of logons/day).
#
# CADENCE: mandates DETECTING a new manifest at least every 24h and
# producing a new artifact set within 6h of detection. cron is every 6h, which both
# satisfies the 24h detection floor with margin AND bounds detection->artifact well
# under 6h (a single run detects + extracts + pushes end to end).
# MEASUREMENT TODO (sentence 2): after the FIRST THREE successful automated
#   runs that actually produced an artifact set, record the measured median + p95 of
#   detection->push wall time HERE, and tighten/loosen the 6h target accordingly.
#   (Left blank until the remote exists and three real runs have landed.)
#     run 1: <build_id> <detected_utc> <pushed_utc> <elapsed>
#     run 2: ...
#     run 3: ...
#     median=<...> p95=<...>  -> 6h target: <kept | tightened to N | loosened to N>
#
# HOSTED-ONLY: windows-latest + ubuntu-latest are hosted runners. No self-hosted dependency.

name: scheduled-extract

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours, UTC
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Explicit Steam build ID to extract (default: latest public branch)'
        required: false
        default: ''

permissions:
  contents: write
  # the commit job commits + pushes the artifact sets and their build/<id> tags.
  # The ambient GITHUB_TOKEN (persisted by actions/checkout) authorizes the push — no
  # PAT needed for git. The ONLY repo secrets this workflow consumes are the Steam
  # tooling-account credentials (secrets.STEAM_USERNAME / secrets.STEAM_PASSWORD; see
  # the STEAM AUTH header note), scoped to the resolve + extract steps only.

concurrency:
  # Never let two forward-capture runs race to commit/push the same or adjacent build.
  group: scheduled-extract
  cancel-in-progress: false

jobs:
  forward-capture:
    name: resolve current build, extract, upload (${{ matrix.platform }})
    runs-on: ${{ matrix.os }} # extraction loads the platform's binaries — runner OS must match (see PLATFORM MATRIX header note).
    strategy:
      fail-fast: false  # one platform's gate failure must not cancel the other's capture.
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
          - platform: linux-x86_64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # fetch-depth: 0 survives the no-build switch: nbgv (Nerdbank.GitVersioning) —
          # the BUNDLE host still stamps the provenance git SHA via ThisAssembly.GitCommitId;
          # at RUN time it reads the checked-out repo's HEAD, and full history is what makes
          # that SHA/height resolve correctly.
          # NB: this checkout is pinned to the run's trigger SHA (github.sha), like every
          # job of the run. That is FINE for a leg: it never pushes, and both legs seeing
          # the SAME base keeps their outputs consistent. Only the commit job needs main's
          # true tip, and it checks out ref: main explicitly.
          fetch-depth: 0
          # NB: `submodules: recursive` is DROPPED on purpose — we no longer build the walker,
          # so the large hl2sdk submodule is not needed. repoRoot discovery only needs the
          # top-level walker/CMakeLists.txt sentinel, which is present in the checkout
          # regardless of whether the submodule is initialized.

      - name: Install walker runtime system libs (linux)
        # WALKER.md "Linux runtime system-lib prerequisite": the build's own bin dirs ship
        # the heavy multimedia stack, but a small set of standard system libs must come from
        # the host OS or dlopen fails loud. WALKER.md claimed these were preinstalled on
        # ubuntu-latest; that stopped being true (observed: run 31553035823 — the CURRENT
        # build's libpanoramauiclient.so pulls libva.so.2, "cannot open shared object file"),
        # so install them explicitly. --no-install-recommends matches the doc's lean-install
        # note: libva-drm2 / libva-x11-2 must be listed by name.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libbz2-1.0 libdrm2 libuuid1 libva2 libva-drm2 libva-x11-2 libvdpau1

      - name: Set up .NET
        # Still required: every host call runs through the muxer as
        # `dotnet cs2-schema-tracker.dll` (uniform across both legs — see the bundle step),
        # so the `dotnet` CLI must be present and version-matched. No compilation happens
        # here — global.json pins the version so it tracks the host's target framework.
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Download latest release bundle (prebuilt host + era walkers)
        # scripts/download-bundle.ps1 (shared with the commit job: one copy of the release-asset
        # contract) fetches the newest GitHub Release's bundle for THIS leg's OS (published by
        # release.yml), unpacks it UNDER the repo checkout at dist/bundle (gitignored), and
        # exports HOST_DLL. Unpacking INSIDE the checkout is REQUIRED: the bundle host discovers
        # the repo root via the sentinel walker/CMakeLists.txt (present in the checkout
        # regardless of the dropped submodule), so running from within the checked-out tree is
        # what makes `extract --commit` write into THIS repo's artifacts/. Every host call is
        # `dotnet <dll>`, uniform across legs and bundle flavors.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $flavor = if ($env:RUNNER_OS -eq 'Windows') { 'windows' } else { 'linux' }
          $dll = ./scripts/download-bundle.ps1 -Flavor $flavor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Use the bundle's PREBUILT era walkers. The current-era walker is resolved from here
          # by the host's era selection + the second layout-signature gate — do NOT pin
          # CS2_WALKER_BIN (a drifted/new layout still fails loud at exit 75, no artifacts).
          $nativesRoot = Join-Path (Resolve-Path dist/bundle).Path 'natives'
          if (-not (Test-Path $nativesRoot)) { Write-Error "bundle missing natives/ at $nativesRoot"; exit 1 }
          "CS2_WALKER_ERAS_ROOT=$nativesRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

          # Point the host at the CHECKED-OUT repo's inventory (absolute path), NOT the bundle's
          # shipped copy. The leg's own new-build row append stays on this runner (the commit
          # job re-records against main's tip via `record-build`), but era resolution must read
          # the repo's committed catalog, not a possibly-stale bundle copy.
          $inv = Join-Path (Resolve-Path .).Path 'data/cs2-assets-inventory.json'
          if (-not (Test-Path $inv)) { Write-Error "repo inventory missing at $inv"; exit 1 }
          "CS2_INVENTORY_PATH=$inv" | Out-File -FilePath $env:GITHUB_ENV -Append

          # Smoke the dotnet-dll invocation + this platform's walkers RIGHT HERE (mirrors
          # release.yml's bundle smoke) so a bad bundle/runtime pairing fails in THIS step,
          # not minutes later inside the extract. Cheap: verify-natives reads local files only.
          & dotnet $dll verify-natives --natives $nativesRoot --platform ${{ matrix.platform }}
          if ($LASTEXITCODE -ne 0) { Write-Error "bundle smoke failed: verify-natives (${{ matrix.platform }}) via 'dotnet $dll'"; exit 1 }

      - name: Resolve current build + skip-if-already-committed
        id: resolve
        # SKIP-IF-COMMITTED STRATEGY (chosen for efficiency):
        #   Pre-resolve the current build id with a CHEAP anonymous PICS probe
        #   (`acquire --probe --build latest`) — manifest-level only, NO multi-GB depot pull —
        #   then no-op when artifacts/<id>/<this leg's platform>/ is already committed. This avoids the
        #   alternative "run the full extract every time and rely on a byte-identical re-walk
        #   producing no git diff", which would download the depot + walk on EVERY 6h run even
        #   when nothing is new (4 wasteful multi-GB pulls/day). The probe answers "is the head a
        #   new build?" for the cost of one PICS logon. A workflow_dispatch build_id input, when
        #   given, overrides the probe (extract that specific build on demand); an already-committed
        #   explicit id is still a no-op by design (forced re-dumps are a local operation).
        # Steam tooling-account credentials (encrypted secrets; see STEAM AUTH header note).
        # Step-scoped on purpose (least exposure), never echoed: the host's DotEnv/auth path
        # reads STEAM_USERNAME / STEAM_PASSWORD from the env and never logs their values.
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $explicit = "${{ github.event.inputs.build_id }}"
          if ($explicit -and $explicit.Trim() -ne "") {
            $buildId = $explicit.Trim()
            Write-Host "workflow_dispatch: explicit build_id=$buildId"
          } else {
            Write-Host "probing current public-branch build id (anonymous PICS, no download)..."
            $probe = & dotnet $env:HOST_DLL acquire --probe --build latest --platform ${{ matrix.platform }} 2>&1
            $probe | ForEach-Object { Write-Host $_ }
            if ($LASTEXITCODE -ne 0) {
              Write-Error "acquire --probe failed (exit $LASTEXITCODE) — could not resolve current build id."
              exit $LASTEXITCODE
            }
            $m = [regex]::Match(($probe -join "`n"), 'build_id=(\d+)')
            if (-not $m.Success) { Write-Error "could not parse build_id from probe output."; exit 1 }
            $buildId = $m.Groups[1].Value
            Write-Host "resolved current build_id=$buildId"
          }

          # Already committed iff THIS platform's set is on disk (source of truth = artifacts/).
          # Per-platform on purpose: a windows-committed build still extracts on the linux leg.
          # The marker path rides the payload's meta.json: the commit job re-runs the same check
          # against main's true tip without spelling the sentinel file out a second time.
          $marker = "artifacts/$buildId/${{ matrix.platform }}/entity_schema.json"
          if (Test-Path $marker) {
            Write-Host "build $buildId is already committed ($marker present) — nothing to do."
            "is_new=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "build $buildId is NEW (no committed set) — will extract."
            "is_new=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          "build_id=$buildId"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "marker=$marker"          | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "detected_utc=$([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Capture current PICS appinfo (forward-capture)
        # The build-level artifacts/<id>/pics-appinfo.json is derived from a PICS appinfo CAPTURE
        # sidecar that `extract --commit` promotes. PICS is CURRENT-ONLY, so the capture MUST be
        # taken now, against the head build, or it is gone. capture-pics owns the whole decision:
        #   * a committed data/pics-captures/<id>.json seeds the sidecar directly (earliest
        #     capture wins; no fetch, so no PICS flake can fail a build whose capture is safe);
        #   * a fresh fetch whose live head build differs from the resolved id writes NO sidecar
        #     and exits 0 (a stale/mistyped explicit id must not commit a mis-associated
        #     document; the extract may still land honestly without pics-appinfo.json);
        #   * a fetch/write FAILURE stays a non-zero exit and fails the leg (never a silent skip).
        if: success() && steps.resolve.outputs.is_new == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildId = "${{ steps.resolve.outputs.build_id }}"
          Write-Host "capturing current PICS appinfo for build $buildId (anonymous, no download)..."
          & dotnet $env:HOST_DLL capture-pics --build $buildId --platform ${{ matrix.platform }}
          if ($LASTEXITCODE -ne 0) {
            Write-Error "capture-pics failed (exit $LASTEXITCODE) for build $buildId. refusing to proceed with a fetch/write failure."
            exit $LASTEXITCODE
          }

      - name: Extract complete set + inline changelog (--commit)
        id: extract
        # NB: a custom `if:` drops the implicit success() status check, so we re-add it —
        # a failed bundle-download or resolve step MUST stop the extract (fail-loud).
        if: success() && steps.resolve.outputs.is_new == 'true'
        # A single extract auto-acquires the inputs, walks, emits the COMPLETE
        # set, and produces changelog.json inline against the immediate committed predecessor
        # — all promoted atomically into artifacts/<id>/<this leg's platform>/ (
        # all-or-nothing; fail-loud). NO continue-on-error: any acquire/walk/emit failure
        # (including the exit-75 layout gate) fails the job and writes NO artifacts.
        #
        # --no-localization-changelog: the changelog's optional localization family diffs THIS
        # build's localization against the PREDECESSOR build's, whose `from` side must be
        # regenerated from the predecessor's content depot. Steam serves only the CURRENT
        # build's content, so an ephemeral runner can never re-acquire a predecessor's
        # content — forward-capture therefore emits the five binary families only (a
        # contract-valid changelog shape). This build's own localization.json is still produced
        # + fingerprinted into provenance.localization. Operator-run local re-dumps (with the
        # content cache present) still produce the full six-family changelog.
        #
        # NB: this workflow never invokes `acquire` directly for the extract — the extract's
        # AUTO-ACQUIRE picks up STEAM_USERNAME / STEAM_PASSWORD from the step env below and
        # auto-selects authenticated logon on its specific-build acquire path (anonymous Steam
        # cannot issue manifest request codes for it, and the DLC-gated tools depot 2347779 is
        # invisible to anonymous logons — see STEAM AUTH header note). No --auth flag to pass
        # here; there is no direct acquire invocation. Step-scoped secrets, never echoed.
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildId = "${{ steps.resolve.outputs.build_id }}"
          Write-Host "extracting build $buildId (${{ matrix.platform }})..."
          & dotnet $env:HOST_DLL extract --build $buildId --platform ${{ matrix.platform }} --commit --no-localization-changelog
          if ($LASTEXITCODE -ne 0) {
            Write-Error "extract failed (exit $LASTEXITCODE) for build $buildId. No artifacts committed."
            exit $LASTEXITCODE
          }

      - name: Stage leg payload for the commit job
        # Runs even when capture/extract failed (as long as resolve said is_new): the commit
        # job decides what can land from what actually arrived. The extract's promote is
        # all-or-nothing, so after a failed extract there is no artifacts/<build>/ to ship
        # and the payload degrades to meta.json + any PICS capture sidecar, which is exactly
        # what the commit job's preservation path needs. The inventory never rides: the commit
        # job records landed platforms against main's tip itself (`record-build`).
        if: ${{ !cancelled() && steps.resolve.outputs.is_new == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildId  = "${{ steps.resolve.outputs.build_id }}"
          $platform = "${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path outgoing | Out-Null

          if ("${{ steps.extract.outcome }}" -eq 'success') {
            New-Item -ItemType Directory -Force -Path "outgoing/artifacts/$buildId" | Out-Null
            Copy-Item "artifacts/$buildId/$platform" "outgoing/artifacts/$buildId/$platform" -Recurse
            # localization.json is gitignored (~199 MB, regenerable) and must not ride the upload.
            Remove-Item "outgoing/artifacts/$buildId/$platform/localization.json" -Force -ErrorAction SilentlyContinue
            # The build manifest rides so the commit job can merge THIS platform's content
            # carrier into the committed one (a whole-file copy would drop the other's).
            if (Test-Path "artifacts/$buildId/omissions.json") {
              Copy-Item "artifacts/$buildId/omissions.json" "outgoing/artifacts/$buildId/omissions.json"
            }
          }

          $sidecar = "cache/pics/$buildId/$platform/pics-appinfo-capture.json"
          if (Test-Path $sidecar) { Copy-Item $sidecar outgoing/pics-appinfo-capture.json }

          # meta.json is written LAST: its presence marks the payload complete, so an upload
          # from a mid-copy failure is ignored whole by the commit job instead of landing a
          # truncated set.
          @{ buildId = $buildId; platform = $platform; marker = "${{ steps.resolve.outputs.marker }}" } |
            ConvertTo-Json | Set-Content -Path outgoing/meta.json

          Write-Host "staged payload:"
          Get-ChildItem outgoing -Recurse -File | ForEach-Object { Write-Host "  $($_.FullName)" }

      - name: Upload leg payload
        if: ${{ !cancelled() && steps.resolve.outputs.is_new == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: extract-${{ matrix.platform }}
          path: outgoing
          if-no-files-found: error   # meta.json always exists when the stage step ran.
          # Short retention on purpose: on success the payload lands in git within minutes,
          # and a failed run's payload is re-derivable while the build is still current.
          # The artifact exists to reach the commit job, plus a short post-mortem window.
          retention-days: 7
          overwrite: true            # a re-run leg replaces its own payload.

      - name: No new build (clean no-op)
        if: success() && steps.resolve.outputs.is_new != 'true'
        # a clean exit-0 when the public branch has not advanced. The 6h cron re-checks.
        shell: pwsh
        run: |
          Write-Host "scheduled-extract: current build ${{ steps.resolve.outputs.build_id }} (${{ matrix.platform }}) already committed. No-op (exit 0)."

  commit:
    name: aggregate leg uploads, commit, tag, push
    # Runs after BOTH legs regardless of their outcome (hence !cancelled()): a failed leg
    # must not discard the other leg's capture, and a run where both extracts failed can
    # still have a PICS capture worth preserving. Single committer by design: the legs
    # never touch git, so there is no push race left to serialize or rebase around.
    needs: forward-capture
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      # Payloads FIRST, into the runner's temp dir (outside the workspace, so the checkout's
      # clean cannot delete them), before any checkout/.NET/bundle setup: on the common
      # no-new-build cron tick neither leg uploads anything, and the job should discover that
      # for the cost of one download-artifact call, not a full multi-GB checkout.
      - name: Download leg payloads
        uses: actions/download-artifact@v4
        with:
          pattern: extract-*
          path: ${{ runner.temp }}/incoming
          # No merge-multiple: each leg lands under incoming/extract-<platform>/, which is
          # the layout commit-forward-capture.ps1 reads. Zero matches (both legs no-op'd
          # or died before resolving) leaves incoming/ absent; the gate below handles that.

      - name: Check for leg payloads
        id: payloads
        shell: pwsh
        run: |
          $incoming = Join-Path $env:RUNNER_TEMP 'incoming'
          $have = (Test-Path $incoming) -and (@(Get-ChildItem $incoming -Directory).Count -gt 0)
          "have=$($have.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if (-not $have) { Write-Host "no leg payloads. nothing to do this run (clean no-op)." }

      - uses: actions/checkout@v5
        if: steps.payloads.outputs.have == 'true'
        with:
          # ref: main, NOT the default: actions/checkout pins every job of a run to the SHA
          # the run was TRIGGERED at (github.sha), and this job is the run's single committer
          # so it must start from main's true current tip instead.
          ref: main
          # Full history: the push needs a coherent parent chain, and the build/<id>
          # tag-exists check needs the tags (fetched with full history).
          fetch-depth: 0

      - name: Set up .NET
        if: steps.payloads.outputs.have == 'true'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Download latest release bundle (host dll only)
        # The aggregation runs the host's MANAGED commands only (merge-omissions, emit-pics,
        # record-build, reconcile-changelog, evolution, commit-plan, verify-artifacts): pure
        # readers/writers of committed JSON, no walkers and no platform binding, so the linux
        # bundle serves BOTH platforms' plans on this ubuntu runner. No verify-natives smoke
        # here for the same reason. HOST_DLL is exported by the shared script.
        if: steps.payloads.outputs.have == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $null = ./scripts/download-bundle.ps1 -Flavor linux
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure git identity
        # Needed so the commit has an author. Commits as the repo owner so forward-capture
        # commits stay consistent with the rest of the history (single author).
        if: steps.payloads.outputs.have == 'true'
        shell: pwsh
        run: |
          git config user.name  "austin3459"
          git config user.email "austin3459@gmail.com"

      - name: Aggregate into commits (one per new build)
        # scripts/commit-forward-capture.ps1 assembles the uploads into the checkout, derives
        # the build-level files against the tip (merge-omissions, emit-pics, record-build,
        # reconcile-changelog), refreshes the evolution artifact, verifies + stages via the
        # host's commit-plan, and makes ONE commit per new build (both platform sets together
        # when both legs succeeded; a partial set when one failed; the preserved PICS capture
        # when none did). It NEVER pushes, and it hands the push step its inputs via
        # <incoming>/push-plan.json.
        if: steps.payloads.outputs.have == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/commit-forward-capture.ps1 -IncomingDir (Join-Path $env:RUNNER_TEMP 'incoming')
          if ($LASTEXITCODE -ne 0) { Write-Error "commit-forward-capture.ps1 failed"; exit $LASTEXITCODE }

      - name: Push commits
        id: push
        # ONE rebase-retry: the legs never push, so the only writer that can interleave is an
        # operator push (local re-dump, backfill) landing between this job's checkout and its
        # push. Rebase the run's commits onto the new tip and retry once; a genuine conflict
        # fails loud (the payloads stay downloadable for 7 days and the next cron re-extracts
        # while the build is current).
        # The `sets` output comes from the script's push-plan.json, never from grepping commit
        # subjects, and both outputs are written BEFORE tagging (its own step below) so a tag
        # hiccup can never skip the channel refresh or the verify gate.
        if: steps.payloads.outputs.have == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pending = @(git rev-list origin/main..HEAD)
          if ($LASTEXITCODE -ne 0) { Write-Error "git rev-list failed"; exit 1 }
          if ($pending.Count -eq 0) {
            Write-Host "nothing to push."
            "pushed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "sets=false"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          $planPath = Join-Path $env:RUNNER_TEMP 'incoming/push-plan.json'
          $sets = $false
          if (Test-Path $planPath) {
            $sets = [bool]((Get-Content $planPath -Raw | ConvertFrom-Json).sets)
          }

          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) {
            Write-Host "push rejected (non-fast-forward?). rebasing onto current origin/main and retrying once..."
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) { Write-Error "git pull --rebase failed"; exit $LASTEXITCODE }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { Write-Error "git push (main) failed after rebase retry"; exit $LASTEXITCODE }
          }

          "pushed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sets=$($sets.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "pushed $($pending.Count) commit(s)."

      - name: Tag pushed builds
        id: tags
        # Tags are created AFTER the push, from the script's push-plan: tagging before the push
        # would leave the rebase-retry path with tags pointing at pre-rebase (orphaned) commits.
        # The commit to tag is located by CONTENT (the newest commit touching the build's
        # artifacts dir), never by matching message text: after a rebase retry the pre-push
        # range is stale, and a patch-equivalent operator commit may have replaced the run's
        # own commit (tagging the surviving identical commit is correct).
        # Failures here are NON-FATAL inline (recorded and surfaced by the last step) so the
        # channel refresh and the verify gate still run for sets that DID land.
        if: success() && steps.push.outputs.pushed == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $anyFailed = $false
          $planPath = Join-Path $env:RUNNER_TEMP 'incoming/push-plan.json'
          $tags = if (Test-Path $planPath) { @((Get-Content $planPath -Raw | ConvertFrom-Json).tags) } else { @() }
          foreach ($t in $tags) {
            $buildId = "$($t.build)"
            $sha = git log -n 1 --format=%H HEAD -- "artifacts/$buildId/"
            if (-not $sha) {
              Write-Warning "could not locate a commit touching artifacts/$buildId/ to tag"
              $anyFailed = $true; continue
            }
            git rev-parse -q --verify "refs/tags/build/$buildId" *> $null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "tag build/$buildId appeared concurrently. not re-tagging."
              continue
            }
            git tag -a "build/$buildId" -m "$($t.message)" $sha
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "git tag failed for build/$buildId"
              $anyFailed = $true; continue
            }
            git push origin "build/$buildId"
            if ($LASTEXITCODE -ne 0) {
              $remote = git ls-remote --tags origin "refs/tags/build/$buildId"
              if ($remote) {
                Write-Host "tag build/$buildId already exists on the remote. keeping the remote tag."
                continue
              }
              Write-Host "tag push failed for build/$buildId. retrying once..."
              git push origin "build/$buildId"
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "git push (tag build/$buildId) failed after retry"
                $anyFailed = $true; continue
              }
            }
            Write-Host "tagged + pushed build/$buildId"
          }
          "failed=$($anyFailed.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit 0

      - name: Refresh latest-artifacts channel
        # The push above is made with the ambient GITHUB_TOKEN, and GitHub's
        # recursive-trigger guard suppresses push-event workflows for such pushes — so
        # publish-latest.yml's `on: push` will NOT fire for forward-capture commits.
        # workflow_dispatch is the documented exception to that guard, so we dispatch it
        # explicitly. (Operator pushes with personal credentials — local re-dumps,
        # backfills — DO fire its push trigger; this step covers only the CI path.)
        # Gated on sets: a PICS-preservation commit changes no artifact set, so the
        # channel has nothing to pick up.
        # NON-FATAL ON PURPOSE: the artifact set is already committed + pushed above, so
        # a failed dispatch must not fail the capture — the channel self-heals on the
        # next publish (it always recomputes from main's newest committed build).
        if: success() && steps.push.outputs.sets == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-latest.yml --ref main
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "could not dispatch publish-latest.yml (exit $LASTEXITCODE) — latest channel will refresh on the next artifact push."
            exit 0
          }
          Write-Host "dispatched publish-latest.yml"

      - name: Verify committed tree (fail-loud observability)
        # WHY THIS RUNS HERE (CS2OpenDev-SchemaTracker#7 item 5): the push above is made
        # with the ambient GITHUB_TOKEN, so ci.yml's push-triggered verify-artifacts gate is
        # suppressed for exactly the commits this workflow lands. Meanwhile the cumulative
        # schema-evolution refresh inside commit-forward-capture.ps1 is deliberately
        # NON-FATAL (a rare, retryable refresh failure must not forfeit a time-sensitive
        # forward capture), which means a stale artifacts/schema_evolution/<platform>.json
        # could otherwise be pushed with no red anywhere. This step closes that loop: it
        # re-runs the same repo-level gate ci.yml uses — including the evolution staleness
        # check — and FAILS THE JOB if anything regressed. It runs AFTER the push and the
        # latest-channel dispatch on purpose: the capture is already safe, the channel
        # refresh is not suppressed, and a failure here is pure observability (the run goes
        # red; the operator re-runs `evolution` and pushes the refreshed file).
        if: success() && steps.push.outputs.sets == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & dotnet $env:HOST_DLL verify-artifacts --artifacts artifacts --inventory data/cs2-assets-inventory.json
          if ($LASTEXITCODE -ne 0) {
            Write-Error "verify-artifacts reported violations on the tree just pushed (see VIOLATION lines above). The artifact set is already safely pushed; fix the reported drift (e.g. re-run 'evolution' and push) before the next capture."
            exit $LASTEXITCODE
          }
          Write-Host "verify-artifacts: committed tree is clean."

      - name: Surface tag failures
        # Tagging is non-fatal inline (see the tag step) so the channel refresh and verify gate
        # always run for pushed sets; a tag that failed to land still marks the run red HERE.
        # Recreate it manually: `git tag -a build/<id>` on the commit that landed
        # artifacts/<id>/ (the tag message derives from that commit's body), then push the tag.
        if: ${{ always() && steps.tags.outputs.failed == 'true' }}
        shell: pwsh
        run: |
          Write-Error "one or more build/<id> tags failed to land (see the tag step's warnings). recreate them manually on the commits that landed the sets."
          exit 1
