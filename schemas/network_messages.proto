// Network message ID table: integer message-ID -> protobuf message-type name, per channel.
//
// Source (PER-BUILD, offline RTTI scan): the id->type table is DERIVED, per build, from a
// static RTTI scan of that build's own binaries — the host locates each `CNetMessagePB<...>`
// instantiation the build actually links and recovers its registered message ID and type name
// (host/src/Cs2SchemaTracker.Host/NetworkMessages/NetworkMessageRttiScanner.cs). The live
// INetworkMessages runtime registry is EMPTY in the headless walk (populating it would require
// ~the full engine Init, which access-violates), so the
// table is reconstructed statically from the binary's own type instantiations rather than from
// any pinned enum source. CONSEQUENCE: this table is build-specific — each build carries only
// the messages IT registers, and dead/unregistered enum values are excluded. It is therefore
// NOT byte-identical across builds that share an hl2sdk pin; it reflects each build's real
// registered wire protocol. (This supersedes the former pin-static table generated by
// walker/tools/gen_netmsg_table.py, which is no longer the source.)
// Each registered network channel (e.g. NetMessages, SvcMessages, ClcMessages,
// Bidirectional, ClientMessages, UserMessages) carries a set of integer message IDs, each
// bound to the name of a protobuf message type. That type name is the same name the
// descriptor extraction emits under protos/<file>.proto for the SAME platform — i.e.
// `proto_message_type` is a cross-reference into this platform's descriptor set.
//
// PLATFORM MODEL (v0.2): one (build_id, platform) artifact set. A single per-platform walk
// loads ALL modules of the per-OS binary depot; the message IDs observed are the union the
// loaded binaries register. IDs and type names are stable across platforms even
// though offsets/sizes elsewhere differ — names do not vary by platform.

syntax = "proto3";

package cs2.schema_tracker.v0;

option csharp_namespace = "Cs2SchemaTracker.Schemas";

// ---- Top-level artifact (network_messages.json) -----------------------------------------

message NetworkMessages {
  string schema_version = 1;       // schemas/ family version (e.g. "0.2.0")
  string build_id       = 2;       // Steam build ID
  string platform       = 3;       // "windows-x86_64" | "linux-x86_64"

  repeated NetworkChannel channels = 100;
}

// A registered network channel/group. CS2 registers messages under named groups (the
// `channel` in the phrasing "per network channel"); the same numeric ID can legitimately
// recur under different channels, so IDs are scoped to their channel here.
message NetworkChannel {
  string name = 1;                 // channel/group name, e.g. "NetMessages", "GameEvents", "TempEntities"
  repeated NetworkMessageEntry messages = 2;
}

// One integer-ID -> protobuf-message-type binding within a channel.
message NetworkMessageEntry {
  int32  id   = 1;                 // numeric message ID as registered in the binary's NetMessages registry
  string proto_message_type = 2;   // fully-qualified .proto message name; cross-references this
                                   // platform's descriptor set (protos/<file>.proto). "" only if
                                   // the binary registers an ID with no resolvable type name (then the
                                   // ID still appears so registry_audit can account for it).
}
